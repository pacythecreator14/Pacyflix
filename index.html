<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PACYFLIX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: white;
    }

    header {
      background: #111;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #e50914;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      min-height: 430px;
      padding: 90px 7%;
      display: flex;
      align-items: center;
      background: linear-gradient(90deg,#080808 20%,transparent),
                  linear-gradient(180deg,#333,#080808);
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #e50914;
    }

    .hero p {
      color: #bbb;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background: #e50914;
      color: white;
      padding: 13px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 50px 7%;
    }

    .title {
      font-size: 30px;
      margin-bottom: 25px;
    }

    .search {
      width: 100%;
      max-width: 400px;
      padding: 14px;
      background: #171717;
      color: white;
      border: 1px solid #333;
      border-radius: 6px;
      margin-bottom: 30px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(170px,1fr));
      gap: 20px;
    }

    .movie {
      background: #151515;
      border-radius: 9px;
      overflow: hidden;
    }

    .poster {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #222;
    }

    .info {
      padding: 14px;
    }

    .info h3 {
      margin-bottom: 7px;
    }

    .info p {
      color: #999;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .watch {
      display: inline-block;
      background: #e50914;
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 5px;
      font-size: 13px;
    }

    #loading {
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #111;
      color: #777;
    }

    @media(max-width:600px) {
      .hero h1 {
        font-size: 37px;
      }

      section {
        padding: 40px 5%;
      }

      nav a {
        font-size: 13px;
        margin-left: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PACY<span>FLIX</span></div>

  <nav>
    <a href="#home">Home</a>
    <a href="#movies">Movies</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>Welcome to <span>PACYFLIX</span></h1>

    <p>
      Watch movies on PACYFLIX.
      Discover new stories, action, drama, comedy and more.
    </p>

    <a href="#movies" class="btn">Explore Movies</a>
  </div>
</section>

<section id="movies">

  <h2 class="title">🎬 Movies</h2>

  <input
    class="search"
    id="search"
    placeholder="🔍 Search movie..."
  >

  <p id="loading">Loading movies...</p>

  <div class="movies" id="movieList"></div>

</section>

<footer>
  © 2026 PACYFLIX
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_KEY";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allMovies = [];

async function loadMovies() {

  const loading = document.getElementById("loading");

  const { data, error } = await client
    .from("movies")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    loading.innerText =
      "❌ Error loading movies: " + error.message;
    return;
  }

  allMovies = data;

  loading.style.display = "none";

  displayMovies(allMovies);
}

function displayMovies(movies) {

  const list = document.getElementById("movieList");

  if (movies.length === 0) {
    list.innerHTML = "<p>No movies available yet.</p>";
    return;
  }

  list.innerHTML = movies.map(movie => `

    <article class="movie">

      <img
        class="poster"
        src="${movie.poster_url}"
        alt="${movie.title}"
      >

      <div class="info">

        <h3>${movie.title}</h3>

        <p>
          ${movie.year || ""}
          •
          ${movie.category || ""}
        </p>

        <a
          class="watch"
          href="${movie.video_url}"
          target="_blank"
        >
          ▶ Watch
        </a>

      </div>

    </article>

  `).join("");
}

document.getElementById("search").addEventListener(
  "input",
  function() {

    const value = this.value.toLowerCase();

    const filtered = allMovies.filter(movie =>
      movie.title.toLowerCase().includes(value)
    );

    displayMovies(filtered);
  }
);

loadMovies();

</script>

</body>
</html>
